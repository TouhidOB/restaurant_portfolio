<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS Studio Login // POP! FOOD STUDIO</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0A0A0C;
      color: #FFF;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: #141418;
      border: 1px solid rgba(255, 221, 0, 0.3);
      box-shadow: 0 0 40px rgba(255, 221, 0, 0.15);
      border-radius: 8px;
      padding: 40px;
      width: 100%;
      maxWidth: 420px;
      text-align: center;
    }
    .pop-badge {
      display: inline-block;
      width: 48px;
      height: 48px;
      line-height: 48px;
      background: #FFDD00;
      color: #000;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 22px;
      border-radius: 6px;
      margin-bottom: 16px;
      box-shadow: 0 0 16px rgba(255, 221, 0, 0.5);
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    p {
      color: #8E8EA0;
      font-size: 13px;
      margin-bottom: 28px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8E8EA0;
      margin-bottom: 6px;
      font-weight: 700;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      background: #1E1E24;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      color: #FFF;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus {
      border-color: #FFDD00;
      box-shadow: 0 0 8px rgba(255, 221, 0, 0.3);
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #FFDD00;
      color: #000;
      border: none;
      border-radius: 4px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s;
    }
    .btn-submit:hover {
      background: #FFE633;
      box-shadow: 0 0 20px rgba(255, 221, 0, 0.5);
    }
    .error-msg {
      background: rgba(245, 101, 101, 0.15);
      border: 1px solid #f56565;
      color: #feb2b2;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="pop-badge">P!</div>
    <h1>POP! FOOD STUDIO</h1>
    <p>HEADLESS CMS STUDIO ACCESS</p>

    {% if error %}
      <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required autofocus placeholder="admin">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required placeholder="••••••••••••">
      </div>
      <button type="submit" class="btn-submit">Enter Studio Console &rarr;</button>
    </form>
  </div>
</body>
</html>
