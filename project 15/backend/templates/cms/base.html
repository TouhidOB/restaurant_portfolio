<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}POP! Studio OS | Restaurant Control Center{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #090A0E;
      --bg-sidebar: #0F1117;
      --bg-surface: #141620;
      --bg-surface-elevated: #1B1E2B;
      --bg-surface-hover: #222636;
      
      --border-subtle: rgba(255, 255, 255, 0.07);
      --border-medium: rgba(255, 255, 255, 0.12);
      --border-focus: #D4FF32;
      
      --text-primary: #F4F5F8;
      --text-secondary: #9DA3B4;
      --text-muted: #62687A;
      
      /* Vibrant Pop Accents */
      --accent-coral: #FF3366;
      --accent-lime: #D4FF32;
      --accent-cobalt: #3B82F6;
      --accent-cyan: #06B6D4;
      --accent-purple: #A855F7;
      --accent-emerald: #10B981;
      --accent-amber: #F59E0B;
      
      --font-display: 'Space Grotesk', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 13.5px;
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    /* Layout structure */
    .cms-container {
      display: flex;
      min-height: 100vh;
    }

    /* Sleek Dark Persistent Sidebar */
    .cms-sidebar {
      width: 280px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      z-index: 100;
      overflow-y: auto;
    }

    .cms-sidebar-header {
      padding: 22px 20px 18px;
      border-bottom: 1px solid var(--border-subtle);
      background: linear-gradient(180deg, rgba(255,51,102,0.06) 0%, transparent 100%);
    }

    .cms-brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .cms-brand-badge {
      background: var(--accent-coral);
      color: #FFF;
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      box-shadow: 0 0 16px rgba(255, 51, 102, 0.4);
    }

    .cms-brand-title {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #FFF;
      line-height: 1.1;
    }

    .cms-brand-sub {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--accent-lime);
      letter-spacing: 1px;
      font-weight: 600;
    }

    /* Live Search Filter */
    .cms-filter-box {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-subtle);
      position: relative;
    }

    .cms-filter-input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 9px 36px 9px 12px;
      font-family: var(--font-body);
      font-size: 12.5px;
      color: var(--text-primary);
      outline: none;
      transition: all 0.2s ease;
    }

    .cms-filter-input:focus {
      border-color: var(--accent-lime);
      box-shadow: 0 0 0 2px rgba(212, 255, 50, 0.15);
      background: var(--bg-surface-elevated);
    }

    .cms-filter-icon {
      position: absolute;
      right: 28px;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      background: var(--bg-surface-elevated);
      padding: 2px 5px;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
      pointer-events: none;
    }

    /* Navigation Items */
    .cms-sidebar-nav {
      flex: 1;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .cms-nav-heading {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 12px 10px 6px;
    }

    .cms-nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      transition: all 0.15s ease;
      border: 1px solid transparent;
    }

    .cms-nav-item:hover {
      background: var(--bg-surface);
      color: var(--text-primary);
      border-color: var(--border-subtle);
    }

    .cms-nav-item.active {
      background: rgba(212, 255, 50, 0.08);
      color: var(--accent-lime);
      border-color: rgba(212, 255, 50, 0.2);
    }

    .cms-nav-item .tag {
      font-family: var(--font-mono);
      font-size: 10px;
      background: var(--bg-surface);
      color: var(--text-muted);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
    }

    .cms-sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-sidebar);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Main Content Surface */
    .cms-main {
      margin-left: 280px;
      flex: 1;
      padding: 32px 40px 80px;
      max-width: 1360px;
    }

    /* Top Action Bar */
    .cms-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .cms-title {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #FFF;
    }

    .cms-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Cards */
    .cms-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 26px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      transition: all 0.25s ease;
    }

    .cms-card:hover {
      border-color: var(--border-medium);
    }

    .cms-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .cms-card-title {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 700;
      color: #FFF;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }

    .btn-lime {
      background: var(--accent-lime);
      color: #0A0B0E;
    }
    .btn-lime:hover {
      background: #e2ff60;
      box-shadow: 0 0 16px rgba(212, 255, 50, 0.4);
    }

    .btn-coral {
      background: var(--accent-coral);
      color: #FFF;
    }
    .btn-coral:hover {
      background: #ff4d7a;
      box-shadow: 0 0 16px rgba(255, 51, 102, 0.4);
    }

    .btn-outline {
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
      border-color: var(--border-medium);
    }
    .btn-outline:hover {
      background: var(--bg-surface-hover);
      border-color: rgba(255,255,255,0.25);
    }

    .btn-danger-outline {
      background: transparent;
      color: #F87171;
      border-color: rgba(248, 113, 113, 0.2);
    }
    .btn-danger-outline:hover {
      background: rgba(248, 113, 113, 0.1);
      border-color: #F87171;
    }

    /* Status Badges */
    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .status-new {
      background: rgba(245, 158, 11, 0.12);
      color: #FBBF24;
      border: 1px solid rgba(245, 158, 11, 0.25);
    }

    .status-confirmed {
      background: rgba(16, 185, 129, 0.12);
      color: #34D399;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .status-cancelled {
      background: rgba(239, 68, 68, 0.12);
      color: #F87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }

    /* Tables */
    .cms-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .cms-table th {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .cms-table td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 13px;
    }

    .cms-table tbody tr:hover td {
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
    }

    /* Form inputs */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 14px;
      font-family: var(--font-body);
      font-size: 13.5px;
      color: var(--text-primary);
      outline: none;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      border-color: var(--accent-lime);
      box-shadow: 0 0 0 2px rgba(212, 255, 50, 0.15);
      background: var(--bg-surface-hover);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 80px;
    }

    /* Alerts */
    .alert {
      padding: 14px 18px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6EE7B7;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #FCA5A5;
    }

    /* Grid layout utilities */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    /* Flash Highlight Animation for Target Sections */
    @keyframes sectionPulse {
      0% { box-shadow: 0 0 0 0 rgba(212, 255, 50, 0.5); }
      70% { box-shadow: 0 0 0 10px rgba(212, 255, 50, 0); }
      100% { box-shadow: 0 0 0 0 rgba(212, 255, 50, 0); }
    }

    .highlight-flash {
      animation: sectionPulse 1.8s ease-out;
      border-color: var(--accent-lime) !important;
    }

    @media (max-width: 900px) {
      .cms-sidebar {
        display: none;
      }
      .cms-main {
        margin-left: 0;
        padding: 20px;
      }
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  {% block body_content %}
  <div class="cms-container">
    {% block page_layout %}{% endblock %}
  </div>
  {% endblock %}

  <script>
    // Live Keyword Search Filter for Persistent Sidebar
    document.addEventListener('DOMContentLoaded', function() {
      const filterInput = document.getElementById('sidebarFilter');
      const navItems = document.querySelectorAll('.cms-nav-item');
      const navHeadings = document.querySelectorAll('.cms-nav-heading');

      if (filterInput) {
        filterInput.addEventListener('input', function(e) {
          const query = e.target.value.toLowerCase().trim();

          navItems.forEach(item => {
            const filterData = (item.getAttribute('data-filter') || '').toLowerCase();
            const textContent = item.textContent.toLowerCase();

            if (!query || filterData.includes(query) || textContent.includes(query)) {
              item.style.display = 'flex';
            } else {
              item.style.display = 'none';
            }
          });

          // Headings visibility
          navHeadings.forEach(heading => {
            let next = heading.nextElementSibling;
            let hasVisibleSiblings = false;
            while (next && next.classList.contains('cms-nav-item')) {
              if (next.style.display !== 'none') {
                hasVisibleSiblings = true;
                break;
              }
              next = next.nextElementSibling;
            }
            heading.style.display = (hasVisibleSiblings || !query) ? 'block' : 'none';
          });
        });

        // Keyboard shortcut ⌘K / Ctrl+K focus
        window.addEventListener('keydown', function(e) {
          if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
            e.preventDefault();
            filterInput.focus();
          }
        });
      }

      // Smooth anchor jump + flash highlight
      navItems.forEach(item => {
        item.addEventListener('click', function(e) {
          const targetId = this.getAttribute('href');
          if (targetId && targetId.startsWith('#')) {
            const targetElem = document.querySelector(targetId);
            if (targetElem) {
              e.preventDefault();
              targetElem.scrollIntoView({ behavior: 'smooth', block: 'start' });
              targetElem.classList.remove('highlight-flash');
              void targetElem.offsetWidth; // trigger reflow
              targetElem.classList.add('highlight-flash');
            }
          }
        });
      });
    });
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
