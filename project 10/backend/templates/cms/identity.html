{% extends 'cms/base.html' %}

{% block content %}
<div class="cms-card">
  <div style="margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
    <h3 style="font-family: var(--font-display); font-size: 1.6rem; color: var(--ivory);">
      Heritage Identity, Coordinates &amp; Service Logistics
    </h3>
    <p style="color: var(--jute); font-size: 0.85rem;">
      Manage restaurant name, bilingual address, concierge contact lines, and operational hours.
    </p>
  </div>

  <form method="POST">
    {% csrf_token %}
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
      <div>
        <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--brass); margin-bottom: 0.4rem; font-weight: 700;">
          Restaurant Name (English)
        </label>
        <input
          type="text"
          name="restaurant_name_en"
          value="{{ content.hero.restaurant_name.en|default:config.restaurant_name }}"
          style="width: 100%; padding: 0.75rem 1rem; background: var(--surface); border: 1px solid var(--border-color); border-radius: 3px; color: var(--ivory); font-size: 0.95rem; outline: none;"
        />
      </div>

      <div>
        <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--brass); margin-bottom: 0.4rem; font-weight: 700;">
          Restaurant Name (Bengali)
        </label>
        <input
          type="text"
          name="restaurant_name_bn"
          value="{{ content.hero.restaurant_name.bn|default:'বাংলার ঐতিহ্য ডাইনিং' }}"
          style="width: 100%; padding: 0.75rem 1rem; background: var(--surface); border: 1px solid var(--border-color); border-radius: 3px; color: var(--ivory); font-size: 0.95rem; outline: none; font-family: 'Noto Serif Bengali', serif;"
        />
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
      <div>
        <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--brass); margin-bottom: 0.4rem; font-weight: 700;">
          Heritage Tagline (English)
        </label>
        <input
          type="text"
          name="tagline_en"
          value="{{ content.hero.tagline.en|default:'' }}"
          style="width: 100%; padding: 0.75rem 1rem; background: var(--surface); border: 1px solid var(--border-color); border-radius: 3px; color: var(--ivory); font-size: 0.9rem; outline: none;"
        />
      </div>

      <div>
        <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--brass); margin-bottom: 0.4rem; font-weight: 700;">
          Heritage Tagline (Bengali)
        </label>
        <input
          type="text"
          name="tagline_bn"
          value="{{ content.hero.tagline.bn|default:'' }}"
          style="width: 100%; padding: 0.75rem 1rem; background: var(--surface); border: 1px solid var(--border-color); border-radius: 3px; color: var(--ivory); font-size: 0.9rem; outline: none; font-family: 'Noto Serif Bengali', serif;"
        />
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
      <div>
        <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--brass); margin-bottom: 0.4rem; font-weight: 700;">
          Address (English)
        </label>
        <input
          type="text"
          name="address_en"
          value="{{ content.location.address.en|default:'House 14, Road 71, Gulshan Heritage Enclave, Dhaka' }}"
          style="width: 100%; padding: 0.75rem 1rem; background: var(--surface); border: 1px solid var(--border-color); border-radius: 3px; color: var(--ivory); font-size: 0.9rem; outline: none;"
        />
      </div>

      <div>
        <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--brass); margin-bottom: 0.4rem; font-weight: 700;">
          Address (Bengali)
        </label>
        <input
          type="text"
          name="address_bn"
          value="{{ content.location.address.bn|default:'বাড়ি ১৪, রোড ৭১, গুলশান হেরিটেজ এনক্লেভ, ঢাকা' }}"
          style="width: 100%; padding: 0.75rem 1rem; background: var(--surface); border: 1px solid var(--border-color); border-radius: 3px; color: var(--ivory); font-size: 0.9rem; outline: none; font-family: 'Noto Serif Bengali', serif;"
        />
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
      <div>
        <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--brass); margin-bottom: 0.4rem; font-weight: 700;">
          Concierge Phone
        </label>
        <input
          type="text"
          name="phone"
          value="{{ content.location.phone|default:'+880 1711-234567' }}"
          style="width: 100%; padding: 0.75rem 1rem; background: var(--surface); border: 1px solid var(--border-color); border-radius: 3px; color: var(--ivory); font-size: 0.9rem; outline: none;"
        />
      </div>

      <div>
        <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--brass); margin-bottom: 0.4rem; font-weight: 700;">
          Concierge Email
        </label>
        <input
          type="email"
          name="email"
          value="{{ content.location.email|default:'hospitality@bengalheritage.com' }}"
          style="width: 100%; padding: 0.75rem 1rem; background: var(--surface); border: 1px solid var(--border-color); border-radius: 3px; color: var(--ivory); font-size: 0.9rem; outline: none;"
        />
      </div>

      <div>
        <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--brass); margin-bottom: 0.4rem; font-weight: 700;">
          Hours (English)
        </label>
        <input
          type="text"
          name="hours_en"
          value="{{ content.location.hours.en|default:'Daily: 12:00 PM – 11:30 PM (Lunch & Heritage Dinner)' }}"
          style="width: 100%; padding: 0.75rem 1rem; background: var(--surface); border: 1px solid var(--border-color); border-radius: 3px; color: var(--ivory); font-size: 0.9rem; outline: none;"
        />
      </div>
    </div>

    <button type="submit" class="btn-primary" style="padding: 0.85rem 2rem;">
      Save Identity &amp; Coordinates ➔
    </button>
  </form>
</div>
{% endblock %}
