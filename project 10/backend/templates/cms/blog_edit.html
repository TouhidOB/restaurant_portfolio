{% extends 'cms/base.html' %}

{% block content %}
<div class="cms-card">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
    <div>
      <h3 style="font-family: var(--font-display); font-size: 1.6rem; color: var(--ivory);">
        Edit Chronicle: {{ post.title }}
      </h3>
      <p style="color: var(--jute); font-size: 0.85rem;">
        Update article narrative, imagery, and publication status.
      </p>
    </div>
    <a href="{% url 'cms_blog' %}" class="btn-secondary" style="font-size: 0.8rem;">
      &larr; Back to Gazette
    </a>
  </div>

  <form method="POST">
    {% csrf_token %}

    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; margin-bottom: 1.25rem;">
      <div>
        <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--brass); margin-bottom: 0.4rem; font-weight: 700;">
          Article Title *
        </label>
        <input
          type="text"
          name="title"
          required
          value="{{ post.title }}"
          style="width: 100%; padding: 0.75rem 1rem; background: var(--surface); border: 1px solid var(--border-color); border-radius: 3px; color: var(--ivory); font-size: 0.9rem; outline: none;"
        />
      </div>

      <div>
        <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--brass); margin-bottom: 0.4rem; font-weight: 700;">
          Editorial Category
        </label>
        <select
          name="category_id"
          style="width: 100%; padding: 0.75rem 1rem; background: var(--surface); border: 1px solid var(--border-color); border-radius: 3px; color: var(--ivory); font-size: 0.9rem; outline: none;"
        >
          {% for cat in categories %}
            <option value="{{ cat.id }}" {% if post.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem; margin-bottom: 1.25rem;">
      <div>
        <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--brass); margin-bottom: 0.4rem; font-weight: 700;">
          URL Slug
        </label>
        <input
          type="text"
          name="slug"
          value="{{ post.slug }}"
          style="width: 100%; padding: 0.75rem 1rem; background: var(--surface); border: 1px solid var(--border-color); border-radius: 3px; color: var(--ivory); font-size: 0.9rem; outline: none;"
        />
      </div>

      <div>
        <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--brass); margin-bottom: 0.4rem; font-weight: 700;">
          Author Byline
        </label>
        <input
          type="text"
          name="author_name"
          value="{{ post.author_name }}"
          style="width: 100%; padding: 0.75rem 1rem; background: var(--surface); border: 1px solid var(--border-color); border-radius: 3px; color: var(--ivory); font-size: 0.9rem; outline: none;"
        />
      </div>

      <div>
        <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--brass); margin-bottom: 0.4rem; font-weight: 700;">
          Reading Time
        </label>
        <input
          type="text"
          name="reading_time"
          value="{{ post.reading_time }}"
          style="width: 100%; padding: 0.75rem 1rem; background: var(--surface); border: 1px solid var(--border-color); border-radius: 3px; color: var(--ivory); font-size: 0.9rem; outline: none;"
        />
      </div>
    </div>

    <div style="margin-bottom: 1.25rem;">
      <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--brass); margin-bottom: 0.4rem; font-weight: 700;">
        Featured Image URL
      </label>
      <input
        type="url"
        name="featured_image"
        value="{{ post.featured_image }}"
        style="width: 100%; padding: 0.75rem 1rem; background: var(--surface); border: 1px solid var(--border-color); border-radius: 3px; color: var(--ivory); font-size: 0.9rem; outline: none;"
      />
    </div>

    <div style="margin-bottom: 1.25rem;">
      <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--brass); margin-bottom: 0.4rem; font-weight: 700;">
        Article Excerpt / Lead
      </label>
      <textarea
        name="excerpt"
        rows="2"
        style="width: 100%; padding: 0.75rem 1rem; background: var(--surface); border: 1px solid var(--border-color); border-radius: 3px; color: var(--ivory); font-size: 0.9rem; outline: none; resize: vertical;"
      >{{ post.excerpt }}</textarea>
    </div>

    <div style="margin-bottom: 1.5rem;">
      <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--brass); margin-bottom: 0.4rem; font-weight: 700;">
        Article Content (HTML supported)
      </label>
      <textarea
        name="content"
        rows="10"
        style="width: 100%; padding: 1rem; background: var(--surface); border: 1px solid var(--border-color); border-radius: 3px; color: var(--ivory); font-family: var(--font-mono); font-size: 0.85rem; line-height: 1.6; outline: none; resize: vertical;"
      >{{ post.content }}</textarea>
    </div>

    <div style="display: flex; align-items: center; gap: 0.6rem; margin-bottom: 2rem;">
      <input
        type="checkbox"
        id="isPublishedPost"
        name="is_published"
        {% if post.is_published %}checked{% endif %}
        style="width: 16px; height: 16px; accent-color: var(--brass);"
      />
      <label for="isPublishedPost" style="font-size: 0.88rem; font-weight: 700; color: var(--ivory);">
        Published &amp; Visible on Public Frontend (/blog/{{ post.slug }})
      </label>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center;">
      <button type="submit" class="btn-primary" style="padding: 0.85rem 2.2rem;">
        Save Changes ➔
      </button>

      <button type="submit" name="action" value="delete_post" class="btn-secondary" style="color: #ef5350;" onclick="return confirm('Permanently remove this chronicle?');">
        Delete Chronicle
      </button>
    </div>
  </form>
</div>
{% endblock %}
