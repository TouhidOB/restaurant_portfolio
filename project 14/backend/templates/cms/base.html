<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CMS Studio | Dark Luxury Steakhouse{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --obsidian: #101010;
      --charcoal: #1C1B19;
      --graphite: #292724;
      --graphite-light: #383430;
      --ivory: #EDE5D8;
      --taupe: #A59A8C;
      --bronze: #94734F;
      --champagne: #C4A878;
      --amber: #D89A4B;
      --burgundy: #542D32;
      --border-dark: rgba(148, 115, 79, 0.25);
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-heading: 'DM Sans', sans-serif;
      --font-body: 'Manrope', sans-serif;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--obsidian);
      color: var(--ivory);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }
    a {
      color: var(--champagne);
      text-decoration: none;
      transition: color 0.2s;
    }
    a:hover {
      color: var(--ivory);
    }
    /* Layout with persistent sidebar */
    .cms-container {
      display: flex;
      min-height: 100vh;
    }
    .cms-sidebar {
      width: 290px;
      background: var(--charcoal);
      border-right: 1px solid var(--border-dark);
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      z-index: 100;
      overflow-y: auto;
    }
    .cms-sidebar-header {
      padding: 24px 20px 16px;
      border-bottom: 1px solid var(--border-dark);
    }
    .cms-brand-logo {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--ivory);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .cms-brand-logo span {
      color: var(--bronze);
    }
    .cms-badge {
      display: inline-block;
      font-family: var(--font-heading);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 2px 8px;
      background: rgba(148, 115, 79, 0.15);
      color: var(--champagne);
      border: 1px solid var(--border-dark);
      border-radius: 2px;
      margin-top: 6px;
    }
    .cms-search-box {
      padding: 14px 20px 8px;
    }
    .cms-search-input {
      width: 100%;
      background: var(--obsidian);
      border: 1px solid var(--border-dark);
      border-radius: 3px;
      padding: 8px 12px;
      color: var(--ivory);
      font-family: var(--font-heading);
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .cms-search-input:focus {
      border-color: var(--champagne);
    }
    .cms-nav-group {
      padding: 12px 0;
      flex: 1;
    }
    .cms-nav-heading {
      font-family: var(--font-heading);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--taupe);
      padding: 8px 20px 4px;
    }
    .cms-nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 20px;
      color: var(--taupe);
      font-family: var(--font-heading);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.2s;
    }
    .cms-nav-item:hover, .cms-nav-item.active {
      color: var(--ivory);
      background: rgba(148, 115, 79, 0.08);
      border-left-color: var(--bronze);
    }
    .cms-nav-item .tag {
      font-size: 10px;
      background: var(--graphite);
      padding: 2px 6px;
      border-radius: 2px;
      color: var(--champagne);
    }
    .cms-sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border-dark);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(16, 16, 16, 0.5);
    }
    /* Main Content Area */
    .cms-main {
      margin-left: 290px;
      flex: 1;
      padding: 32px 40px;
      max-width: 1300px;
    }
    .cms-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-dark);
    }
    .cms-title {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--ivory);
    }
    .cms-actions {
      display: flex;
      gap: 12px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      font-family: var(--font-heading);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      text-decoration: none;
    }
    .btn-bronze {
      background: var(--bronze);
      color: var(--obsidian);
    }
    .btn-bronze:hover {
      background: var(--champagne);
      color: var(--obsidian);
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border-dark);
      color: var(--ivory);
    }
    .btn-outline:hover {
      border-color: var(--champagne);
      color: var(--champagne);
    }
    .btn-danger {
      background: #7a2323;
      color: #fff;
    }
    .btn-danger:hover {
      background: #9c2d2d;
    }
    /* Cards and Panels */
    .cms-card {
      background: var(--charcoal);
      border: 1px solid var(--border-dark);
      border-radius: 4px;
      padding: 24px;
      margin-bottom: 24px;
      transition: box-shadow 0.3s, border-color 0.3s;
    }
    .cms-card.flash-highlight {
      border-color: var(--champagne);
      box-shadow: 0 0 25px rgba(196, 168, 120, 0.35);
    }
    .cms-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(148, 115, 79, 0.15);
    }
    .cms-card-title {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--champagne);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    /* Form inputs */
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--taupe);
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      background: var(--graphite);
      border: 1px solid var(--border-dark);
      border-radius: 3px;
      padding: 10px 14px;
      color: var(--ivory);
      font-family: var(--font-body);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-control:focus {
      border-color: var(--champagne);
    }
    textarea.form-control {
      min-height: 90px;
      resize: vertical;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    /* Table styles */
    .cms-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    .cms-table th {
      text-align: left;
      font-family: var(--font-heading);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--taupe);
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-dark);
    }
    .cms-table td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(148, 115, 79, 0.1);
      color: var(--ivory);
      font-size: 13px;
    }
    .badge-status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 2px;
      font-family: var(--font-heading);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .status-pending { background: rgba(216, 154, 75, 0.2); color: #f3be7a; border: 1px solid #d89a4b; }
    .status-confirmed { background: rgba(72, 187, 120, 0.2); color: #68d391; border: 1px solid #38a169; }
    .status-cancelled { background: rgba(229, 62, 62, 0.2); color: #fc8181; border: 1px solid #e53e3e; }

    /* Alert / Flash messages */
    .alert {
      padding: 12px 18px;
      background: rgba(148, 115, 79, 0.15);
      border: 1px solid var(--bronze);
      border-radius: 3px;
      color: var(--champagne);
      margin-bottom: 20px;
      font-size: 13px;
    }
    .alert-error {
      background: rgba(122, 35, 35, 0.3);
      border-color: #a83232;
      color: #ff9999;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block body_content %}{% endblock %}
</body>
</html>
