{% extends "cms/base.html" %}

{% block title %}Steakhouse Identity & Hours | Charred & Prime CMS{% endblock %}

{% block content %}
<form method="POST" action="{% url 'cms_save_identity' %}">
  {% csrf_token %}
  
  <div class="cms-card">
    <div class="cms-card-header">
      <div class="cms-card-title">
        ⚙️ Steakhouse Brand Identity & Coordinates
      </div>
      <button type="submit" class="btn btn-bronze">
        💾 Save Identity Settings
      </button>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label class="form-label">Steakhouse Name</label>
        <input type="text" name="restaurant_name" class="form-control" value="{{ config.restaurant_name }}">
      </div>
      <div class="form-group">
        <label class="form-label">Brand Tagline</label>
        <input type="text" name="tagline" class="form-control" value="{{ site_info.tagline|default:'The Art of the Steakhouse' }}">
      </div>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label class="form-label">Concierge Phone Number</label>
        <input type="text" name="contact_phone" class="form-control" value="{{ site_info.phone|default:'+1 (212) 840-7832' }}">
      </div>
      <div class="form-group">
        <label class="form-label">Concierge Inquiries Email</label>
        <input type="email" name="contact_email" class="form-control" value="{{ site_info.email|default:'concierge@charredandprime.com' }}">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Physical Address</label>
      <input type="text" name="address" class="form-control" value="{{ site_info.address|default:'482 Lexington Avenue, Manhattan, NY 10017' }}">
    </div>

    <div class="form-group">
      <label class="form-label">Operating & Service Hours Summary</label>
      <textarea name="opening_hours" class="form-control" rows="3">{{ site_info.hours|default:'Tuesday – Sunday: 5:00 PM – 11:30 PM (Grill till 11:00 PM)&#10;Executive Lunch: Tuesday – Friday 11:30 AM – 2:30 PM' }}</textarea>
    </div>
  </div>
</form>
{% endblock %}
