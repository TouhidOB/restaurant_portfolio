{% extends 'cms/base.html' %}

{% block title %}VERDANT // EDIT DISPATCH: {{ post.title }}{% endblock %}

{% block content %}
<div class="cms-page-header" style="margin-bottom: 2rem;">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem;">
        <div>
            <div style="display: flex; align-items: center; gap: 0.75rem;">
                <a href="{% url 'cms_blog' %}" style="color: var(--text-sand); text-decoration: none; font-family: var(--font-mono); font-size: 0.85rem;">
                    &larr; BACK TO JOURNAL
                </a>
                <span style="color: var(--border-botanical);">/</span>
                <span class="section-tag">EDIT DISPATCH</span>
            </div>
            <h1 style="font-family: var(--font-serif); font-size: 2.2rem; font-weight: 700; margin-top: 0.5rem; letter-spacing: -0.01em;">
                {{ post.title }}
            </h1>
            <p style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-sand); margin-top: 0.25rem;">
                Public URL: <a href="http://localhost:3000/blog/{{ post.slug }}" target="_blank" style="color: var(--accent-terracotta); text-decoration: none;">/blog/{{ post.slug }} ↗</a>
            </p>
        </div>
        <div style="display: flex; gap: 0.75rem;">
            <a href="http://localhost:3000/blog/{{ post.slug }}" target="_blank" class="btn-tropical-secondary">
                PREVIEW ARTICLE ↗
            </a>
            <button type="submit" form="editBlogForm" class="btn-tropical">
                UPDATE DISPATCH &rarr;
            </button>
        </div>
    </div>
</div>

<form method="post" action="{% url 'cms_blog_edit' post.pk %}" id="editBlogForm">
    {% csrf_token %}
    <div style="background: var(--bg-forest); border: 1px solid var(--border-botanical); padding: 1.75rem; border-radius: 6px;">
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1.25rem; margin-bottom: 1rem;">
            <div class="form-group">
                <label class="form-label" for="postTitle">Dispatch Headline *</label>
                <input type="text" id="postTitle" name="title" class="form-input" required value="{{ post.title }}">
            </div>
            <div class="form-group">
                <label class="form-label" for="postCat">Category *</label>
                <select id="postCat" name="category" class="form-input" required style="background: var(--bg-dark); color: #fff;">
                    {% for cat in categories %}
                        <option value="{{ cat.pk }}" {% if post.category_id == cat.pk %}selected{% endif %}>{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1rem;">
            <div class="form-group">
                <label class="form-label" for="postSlug">URL Slug</label>
                <input type="text" id="postSlug" name="slug" class="form-input" value="{{ post.slug }}" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="postCover">Cover Photography URL</label>
                <input type="url" id="postCover" name="cover_image" class="form-input" value="{{ post.cover_image }}">
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1rem;">
            <div class="form-group">
                <label class="form-label" for="postAuthor">Author Byline</label>
                <input type="text" id="postAuthor" name="author_name" class="form-input" value="{{ post.author_name }}">
            </div>
            <div class="form-group">
                <label class="form-label" for="postRead">Estimated Read Time</label>
                <input type="text" id="postRead" name="read_time" class="form-input" value="{{ post.read_time }}">
            </div>
        </div>

        <div class="form-group" style="margin-bottom: 1rem;">
            <label class="form-label" for="postExcerpt">Editorial Excerpt / Abstract</label>
            <textarea id="postExcerpt" name="excerpt" class="form-textarea" rows="2">{{ post.excerpt }}</textarea>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label class="form-label" for="postContent">Full Article Body</label>
            <textarea id="postContent" name="content" class="form-textarea" rows="12">{{ post.content }}</textarea>
        </div>

        <label style="display: inline-flex; align-items: center; gap: 0.6rem; cursor: pointer; font-family: var(--font-mono); font-size: 0.85rem; color: #fff;">
            <input type="checkbox" name="is_published" {% if post.is_published %}checked{% endif %} style="accent-color: var(--accent-terracotta); width: 16px; height: 16px;">
            <span>Publish Dispatch Live</span>
        </label>
    </div>
</form>
{% endblock %}
