{% extends "cms/base.html" %}

{% block title %}Edit Article: {{ post.title }} — AURA MARINA CMS{% endblock %}

{% block content %}
<form method="POST" action="{% url 'cms_edit_blog_post' post.pk %}">
    {% csrf_token %}

    <div class="topbar">
        <div class="topbar-title">
            <div style="display: flex; align-items: center; gap: 10px;">
                <a href="{% url 'cms_blog' %}" style="color: var(--muted-stone); text-decoration: none; font-size: 20px;">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <h2>Edit Mediterranean Journal Article</h2>
            </div>
            <p>Editing story: <span class="mono-font" style="color: var(--ocean-blue); font-weight: 600;">/blog/{{ post.slug }}</span></p>
        </div>
        <div class="topbar-actions">
            <a href="http://127.0.0.1:3000/blog/{{ post.slug }}" target="_blank" class="btn-secondary">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> Preview Live Article
            </a>
            <button type="submit" class="btn-primary">
                <i class="fa-solid fa-floppy-disk"></i> Save Article Changes
            </button>
        </div>
    </div>

    <div class="cms-card">
        <div class="form-row">
            <div class="form-group">
                <label for="title">Article Title</label>
                <input type="text" id="title" name="title" class="form-control" value="{{ post.title }}" required>
            </div>
            <div class="form-group">
                <label for="slug">URL Slug</label>
                <input type="text" id="slug" name="slug" class="form-control mono-font" value="{{ post.slug }}" required>
            </div>
            <div class="form-group">
                <label for="category_id">Category</label>
                <select id="category_id" name="category_id" class="form-control">
                    <option value="">-- No Category --</option>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}" {% if post.category and post.category.id == cat.id %}selected{% endif %}>
                        {{ cat.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="author_name">Author Name</label>
                <input type="text" id="author_name" name="author_name" class="form-control" value="{{ post.author_name }}">
            </div>
            <div class="form-group">
                <label for="author_role">Author Role / Distinction</label>
                <input type="text" id="author_role" name="author_role" class="form-control" value="{{ post.author_role }}">
            </div>
            <div class="form-group">
                <label for="read_time_minutes">Read Time (Minutes)</label>
                <input type="number" id="read_time_minutes" name="read_time_minutes" class="form-control mono-font" value="{{ post.read_time_minutes }}">
            </div>
        </div>

        <div class="form-group">
            <label for="cover_image_url">Cover Image URL</label>
            <input type="url" id="cover_image_url" name="cover_image_url" class="form-control" value="{{ post.cover_image_url }}">
            {% if post.cover_image_url %}
            <div style="margin-top: 10px; width: 220px; height: 120px; border-radius: 8px; overflow: hidden; border: 1px solid var(--travertine-border);">
                <img src="{{ post.cover_image_url }}" alt="Cover preview" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            {% endif %}
        </div>

        <div class="form-group">
            <label for="excerpt">Excerpt Summary</label>
            <textarea id="excerpt" name="excerpt" class="form-control" style="min-height: 80px;">{{ post.excerpt }}</textarea>
        </div>

        <div class="form-group">
            <label for="content">Full Article Story Content</label>
            <textarea id="content" name="content" class="form-control mono-font" style="min-height: 360px; line-height: 1.6; font-size: 13.5px;">{{ post.content }}</textarea>
        </div>

        <div style="display: flex; gap: 24px; align-items: center; border-top: 1px solid #F0ECE4; padding-top: 16px;">
            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer;">
                <input type="checkbox" name="is_published" {% if post.is_published %}checked{% endif %}>
                <span>Published Live to Public</span>
            </label>
            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer;">
                <input type="checkbox" name="is_featured" {% if post.is_featured %}checked{% endif %}>
                <span>Featured Hero Article</span>
            </label>
        </div>
    </div>
</form>
{% endblock %}
