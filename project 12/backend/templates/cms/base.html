<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Villa Riviera CMS Studio{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --c-limestone: #E9DFCF;
      --c-ivory: #F7F3EA;
      --c-navy: #263A48;
      --c-terracotta: #B96F4F;
      --c-olive: #596448;
      --c-seaglass: #A9BDB5;
      --c-travertine: #C9B99F;
      --c-charcoal: #302F2B;
      --c-bronze: #94734F;
      --c-card-bg: #FFFFFF;
      --c-border: rgba(48, 47, 43, 0.12);
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--c-ivory);
      color: var(--c-charcoal);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4, .font-serif {
      font-family: var(--font-display);
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    /* Studio Header */
    .studio-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--c-navy);
      color: var(--c-ivory);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      border-bottom: 2px solid var(--c-terracotta);
    }
    .studio-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .studio-logo {
      font-family: var(--font-display);
      font-size: 24px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--c-ivory);
      font-weight: 700;
      text-decoration: none;
    }
    .studio-badge {
      background: rgba(185, 111, 79, 0.35);
      color: #FFD2B8;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 600;
      border: 1px solid rgba(185, 111, 79, 0.5);
    }
    .header-links {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .btn-header {
      background: rgba(255, 255, 255, 0.08);
      color: var(--c-ivory);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 7px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-header:hover {
      background: var(--c-terracotta);
      border-color: var(--c-terracotta);
      color: #fff;
    }

    /* Layout */
    .app-layout {
      display: flex;
      min-height: calc(100vh - 61px);
    }

    /* Fixed Sidebar */
    .cms-sidebar {
      width: 290px;
      flex-shrink: 0;
      background: #FFFFFF;
      border-right: 1px solid var(--c-border);
      position: sticky;
      top: 61px;
      height: calc(100vh - 61px);
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .sidebar-search {
      position: relative;
    }
    .sidebar-search input {
      width: 100%;
      padding: 10px 12px 10px 34px;
      border: 1px solid var(--c-border);
      border-radius: 8px;
      font-size: 13px;
      background: var(--c-ivory);
      color: var(--c-charcoal);
      outline: none;
      transition: border-color 0.2s ease;
    }
    .sidebar-search input:focus {
      border-color: var(--c-terracotta);
      background: #fff;
    }
    .sidebar-search::before {
      content: "🔍";
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      opacity: 0.5;
    }
    .sidebar-group-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #8C847B;
      padding: 6px 10px 4px;
    }
    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .nav-item a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 6px;
      color: var(--c-charcoal);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .nav-item a:hover {
      background: var(--c-limestone);
      color: var(--c-navy);
    }
    .nav-item.active a {
      background: var(--c-navy);
      color: var(--c-ivory);
      font-weight: 600;
    }
    .nav-badge {
      margin-left: auto;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(185, 111, 79, 0.15);
      color: var(--c-terracotta);
      font-weight: 600;
    }

    /* Main Content Area */
    .cms-content {
      flex: 1;
      padding: 32px 40px;
      max-width: 1300px;
      overflow-x: hidden;
    }

    /* Cards & Form Styles */
    .cms-card {
      background: #FFFFFF;
      border: 1px solid var(--c-border);
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 28px;
      box-shadow: 0 4px 20px rgba(38, 58, 72, 0.04);
      transition: outline 0.3s ease, transform 0.2s ease;
      scroll-margin-top: 80px;
    }
    .cms-card.flash-highlight {
      outline: 3px solid var(--c-terracotta);
      box-shadow: 0 0 25px rgba(185, 111, 79, 0.35);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--c-border);
    }
    .card-title {
      font-size: 22px;
      color: var(--c-navy);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-desc {
      font-size: 13.5px;
      color: #6C6863;
      margin-top: 3px;
    }

    /* Forms */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group.full-width {
      grid-column: 1 / -1;
    }
    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--c-navy);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    input[type="text"], input[type="email"], input[type="number"], select, textarea {
      padding: 10px 14px;
      border: 1px solid var(--c-border);
      border-radius: 7px;
      font-family: var(--font-sans);
      font-size: 14px;
      background: var(--c-ivory);
      color: var(--c-charcoal);
      transition: all 0.2s ease;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--c-terracotta);
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(185, 111, 79, 0.15);
    }
    textarea {
      min-height: 90px;
      resize: vertical;
    }

    /* Buttons */
    .btn {
      padding: 10px 22px;
      border-radius: 7px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--c-terracotta);
      color: #fff;
    }
    .btn-primary:hover {
      background: #9D5B3E;
    }
    .btn-navy {
      background: var(--c-navy);
      color: #fff;
    }
    .btn-navy:hover {
      background: #182630;
    }
    .btn-danger {
      background: #E5484D;
      color: #fff;
    }
    .btn-danger:hover {
      background: #C93237;
    }
    .btn-sm {
      padding: 5px 12px;
      font-size: 12px;
    }

    /* Tables */
    .table-container {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--c-border);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13.5px;
    }
    th {
      background: var(--c-limestone);
      padding: 12px 16px;
      font-weight: 600;
      color: var(--c-navy);
      text-transform: uppercase;
      font-size: 11.5px;
      letter-spacing: 0.05em;
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--c-border);
      vertical-align: middle;
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr:hover td {
      background: rgba(233, 223, 207, 0.25);
    }

    /* Badges */
    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .status-Pending {
      background: #FEF3C7;
      color: #92400E;
    }
    .status-Confirmed {
      background: #D1FAE5;
      color: #065F46;
    }
    .status-Cancelled {
      background: #FEE2E2;
      color: #991B1B;
    }

    /* Flash Messages */
    .messages-container {
      margin-bottom: 24px;
    }
    .alert {
      padding: 14px 18px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .alert-success {
      background: #ECFDF5;
      color: #065F46;
      border: 1px solid #A7F3D0;
    }
    .alert-error {
      background: #FEF2F2;
      color: #991B1B;
      border: 1px solid #FECACA;
    }
    .alert-info {
      background: #EFF6FF;
      color: #1E40AF;
      border: 1px solid #BFDBFE;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- Studio Header -->
  <header class="studio-header">
    <div class="studio-brand">
      <a href="{% url 'cms_dashboard' %}" class="studio-logo">Villa Riviera</a>
      <span class="studio-badge">CMS Studio 2.0</span>
    </div>
    <div class="header-links">
      <a href="http://127.0.0.1:3000" target="_blank" class="btn-header" title="Open Public Website">
        <span>🌐</span> View Public Site
      </a>
      <a href="{% url 'cms_logout' %}" class="btn-header" style="background: rgba(229, 72, 77, 0.2); border-color: rgba(229, 72, 77, 0.4);">
        <span>🚪</span> Log Out
      </a>
    </div>
  </header>

  <div class="app-layout">
    {% block layout %}{% endblock %}
  </div>

  <script>
    // Live Sidebar Search & Section Highlighting
    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('sidebarFilter');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          const query = e.target.value.toLowerCase();
          const items = document.querySelectorAll('.nav-item');
          items.forEach(item => {
            const text = item.textContent.toLowerCase();
            if (text.includes(query)) {
              item.style.display = 'block';
            } else {
              item.style.display = 'none';
            }
          });
        });
      }

      // Smooth scroll & flash highlight on click
      const navLinks = document.querySelectorAll('.nav-item a');
      navLinks.forEach(link => {
        link.addEventListener('click', (e) => {
          const targetId = link.getAttribute('href');
          if (targetId && targetId.startsWith('#')) {
            const targetEl = document.querySelector(targetId);
            if (targetEl) {
              targetEl.classList.add('flash-highlight');
              setTimeout(() => {
                targetEl.classList.remove('flash-highlight');
              }, 1600);
            }
          }
        });
      });
    });
  </script>
</body>
</html>
