{% extends 'cms/base.html' %}

{% block content %}
<div class="cms-card">
  <div style="margin-bottom: 2rem; border-bottom: 1px solid var(--card-border); padding-bottom: 1rem;">
    <h3 style="font-family: var(--font-display); font-size: 1.6rem; color: var(--warm-cream);">
      3D Spatial Tour &amp; Viewpoints Management
    </h3>
    <p style="color: var(--soft-stone); font-size: 0.85rem;">
      Configure the 5 interactive architectural camera viewpoints for the Three.js glasshouse simulator.
    </p>
  </div>

  <form method="POST">
    {% csrf_token %}
    <input type="hidden" name="action" value="save_tour">

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
      <div class="form-group">
        <label class="form-label">Tour Title</label>
        <input type="text" name="title" value="{{ tour.title|default:'Interactive Botanical Glasshouse Tour' }}" class="form-control">
      </div>
      <div class="form-group">
        <label class="form-label">Subtitle</label>
        <input type="text" name="subtitle" value="{{ tour.subtitle|default:'EXPLORE THE FIVE SANCTUARIES' }}" class="form-control">
      </div>
    </div>

    <div class="form-group" style="margin-bottom: 2rem;">
      <label class="form-label">Tour Description</label>
      <textarea name="description" rows="3" class="form-control">{{ tour.description|default:'Navigate our double-height glass pavilion across 5 distinct living botanical zones.' }}</textarea>
    </div>

    <button type="submit" class="btn-action btn-copper" style="padding: 0.85rem 2rem;">
      Save Tour Configuration ➔
    </button>
  </form>
</div>
{% endblock %}
