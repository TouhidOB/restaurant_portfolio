{% extends 'cms/base.html' %}

{% block content %}
<div class="cms-card">
  <div style="margin-bottom: 2rem; border-bottom: 1px solid var(--card-border); padding-bottom: 1rem;">
    <h3 style="font-family: var(--font-display); font-size: 1.6rem; color: var(--warm-cream);">
      Guest Praise &amp; Critical Acclaim
    </h3>
    <p style="color: var(--soft-stone); font-size: 0.85rem;">
      Editorial reviews, guest testimonials, and architectural commendations.
    </p>
  </div>

  <form method="POST">
    {% csrf_token %}
    <div class="form-group">
      <label class="form-label">Testimonials Title</label>
      <input type="text" name="title" value="{{ testimonials.title|default:'Guest Impressions & Praise' }}" class="form-control">
    </div>

    <div class="form-group" style="margin-bottom: 2rem;">
      <label class="form-label">Reviews Array (JSON)</label>
      <textarea name="reviews_json" rows="12" class="form-control" style="font-family: var(--font-mono); font-size: 0.85rem;">{{ reviews_json }}</textarea>
    </div>

    <button type="submit" class="btn-action btn-copper" style="padding: 0.85rem 2rem;">
      Save Guest Praise ➔
    </button>
  </form>
</div>
{% endblock %}
