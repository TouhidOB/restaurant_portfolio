{% extends 'cms/base.html' %}

{% block content %}
<div class="cms-card">
  <div style="margin-bottom: 2rem; border-bottom: 1px solid var(--card-border); padding-bottom: 1rem;">
    <h3 style="font-family: var(--font-display); font-size: 1.6rem; color: var(--warm-cream);">
      Botanical Identity, Coordinates &amp; Service Logistics
    </h3>
    <p style="color: var(--soft-stone); font-size: 0.85rem;">
      Manage café name, physical address, concierge contact lines, and operational hours.
    </p>
  </div>

  <form method="POST">
    {% csrf_token %}
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
      <div>
        <label class="form-label">Café Name</label>
        <input
          type="text"
          name="cafe_name"
          value="{{ config.cafe_name|default:'VERDANT ATRIUM BOTANICAL GLASSHOUSE CAFÉ' }}"
          class="form-control"
        />
      </div>

      <div>
        <label class="form-label">Botanical Tagline</label>
        <input
          type="text"
          name="tagline"
          value="{{ content.hero.tagline|default:'Where Contemporary Glass Architecture Meets Living Botanical Nature' }}"
          class="form-control"
        />
      </div>
    </div>

    <div style="margin-bottom: 1.5rem;">
      <label class="form-label">Physical Coordinates / Address</label>
      <input
        type="text"
        name="address"
        value="{{ content.location.address|default:'420 Conservatory Way, Botanical District, Portland, OR 97201' }}"
        class="form-control"
      />
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
      <div>
        <label class="form-label">Concierge Phone Line</label>
        <input
          type="text"
          name="phone"
          value="{{ content.location.phone|default:'+1 (503) 555-8373' }}"
          class="form-control"
        />
      </div>

      <div>
        <label class="form-label">Concierge Email</label>
        <input
          type="email"
          name="email"
          value="{{ content.location.email|default:'concierge@verdant-atrium.com' }}"
          class="form-control"
        />
      </div>
    </div>

    <div style="margin-bottom: 2rem;">
      <label class="form-label">Service &amp; Shift Schedule</label>
      <input
        type="text"
        name="hours"
        value="{{ content.location.hours|default:'Mon – Fri: 07:00 – 22:00 | Sat – Sun: 08:00 – 23:00 (Brunch 08:00–15:30 • Dinner 17:30–23:00)' }}"
        class="form-control"
      />
    </div>

    <button type="submit" class="btn-action btn-copper" style="padding: 0.85rem 2rem; font-size: 0.9rem;">
      Save Logistics Settings ➔
    </button>
  </form>
</div>
{% endblock %}
