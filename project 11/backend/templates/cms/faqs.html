{% extends 'cms/base.html' %}

{% block content %}
<div class="cms-card">
  <div style="margin-bottom: 2rem; border-bottom: 1px solid var(--card-border); padding-bottom: 1rem;">
    <h3 style="font-family: var(--font-display); font-size: 1.6rem; color: var(--warm-cream);">
      Frequently Asked Questions &amp; Visiting Guidelines
    </h3>
    <p style="color: var(--soft-stone); font-size: 0.85rem;">
      Parking logistics, conservatory rules, private buyout policies, and dietary accommodation queries.
    </p>
  </div>

  <form method="POST">
    {% csrf_token %}
    <div class="form-group">
      <label class="form-label">FAQs Title</label>
      <input type="text" name="title" value="{{ faqs.title|default:'Visiting Guidelines & FAQs' }}" class="form-control">
    </div>

    <div class="form-group" style="margin-bottom: 2rem;">
      <label class="form-label">FAQ Items Array (JSON)</label>
      <textarea name="faqs_json" rows="12" class="form-control" style="font-family: var(--font-mono); font-size: 0.85rem;">{{ faqs_json }}</textarea>
    </div>

    <button type="submit" class="btn-action btn-copper" style="padding: 0.85rem 2rem;">
      Save Botanical FAQs ➔
    </button>
  </form>
</div>
{% endblock %}
