<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SEOUL STREET CMS Studio — 서울포차{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-midnight: #111316;
      --color-charcoal: #1B1D22;
      --color-charcoal-light: #252830;
      --color-magenta: #FF2E88;
      --color-cyan: #21D4E8;
      --color-coral: #FF594D;
      --color-amber: #FFB347;
      --color-concrete: #777B83;
      --color-white: #F6F4F0;
      --color-silver: #B6BAC2;
      --color-border: rgba(246, 244, 240, 0.12);
      --font-display: 'Space Grotesk', sans-serif;
      --font-condensed: 'Barlow Condensed', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-korean: 'Noto Sans KR', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--color-midnight);
      color: var(--color-white);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4 {
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    /* Studio Header */
    .studio-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(17, 19, 22, 0.95);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      border-bottom: 2px solid var(--color-magenta);
      box-shadow: 0 4px 20px rgba(255, 46, 136, 0.15);
    }
    .studio-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .studio-logo {
      font-family: var(--font-display);
      font-size: 22px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-white);
      font-weight: 800;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .studio-logo .neon-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--color-magenta);
      box-shadow: 0 0 10px var(--color-magenta);
      display: inline-block;
    }
    .studio-badge {
      background: rgba(255, 46, 136, 0.18);
      color: var(--color-magenta);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 700;
      border: 1px solid rgba(255, 46, 136, 0.5);
      font-family: var(--font-condensed);
    }
    .header-links {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .btn-header {
      background: rgba(255, 255, 255, 0.06);
      color: var(--color-white);
      border: 1px solid var(--color-border);
      padding: 7px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-header:hover {
      background: var(--color-magenta);
      border-color: var(--color-magenta);
      color: #fff;
      box-shadow: 0 0 12px rgba(255, 46, 136, 0.4);
    }

    /* Layout */
    .app-layout {
      display: flex;
      min-height: calc(100vh - 61px);
    }

    /* Fixed Sidebar */
    .cms-sidebar {
      width: 300px;
      flex-shrink: 0;
      background: var(--color-charcoal);
      border-right: 1px solid var(--color-border);
      position: sticky;
      top: 61px;
      height: calc(100vh - 61px);
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .sidebar-search {
      position: relative;
    }
    .sidebar-search input {
      width: 100%;
      padding: 10px 12px 10px 34px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      font-size: 13px;
      background: var(--color-midnight);
      color: var(--color-white);
      outline: none;
      transition: border-color 0.2s ease;
    }
    .sidebar-search input:focus {
      border-color: var(--color-magenta);
      box-shadow: 0 0 10px rgba(255, 46, 136, 0.25);
    }
    .sidebar-search::before {
      content: "🔍";
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      opacity: 0.6;
    }
    .sidebar-group-title {
      font-family: var(--font-condensed);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-concrete);
      padding: 6px 10px 4px;
    }
    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .nav-item a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 6px;
      color: var(--color-silver);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .nav-item a:hover {
      background: var(--color-charcoal-light);
      color: var(--color-cyan);
    }
    .nav-item.active a {
      background: rgba(255, 46, 136, 0.15);
      border: 1px solid rgba(255, 46, 136, 0.4);
      color: var(--color-white);
      font-weight: 600;
    }
    .nav-badge {
      margin-left: auto;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(255, 46, 136, 0.2);
      color: var(--color-magenta);
      font-weight: 700;
    }

    /* Main Content Area */
    .cms-content {
      flex: 1;
      padding: 32px 40px;
      max-width: 1300px;
      overflow-x: hidden;
    }

    /* Cards & Form Styles */
    .cms-card {
      background: var(--color-charcoal);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 28px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: outline 0.3s ease, box-shadow 0.3s ease;
      scroll-margin-top: 80px;
    }
    .cms-card.flash-highlight {
      outline: 2px solid var(--color-magenta);
      box-shadow: 0 0 25px rgba(255, 46, 136, 0.5);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--color-border);
    }
    .card-title {
      font-size: 22px;
      color: var(--color-white);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-desc {
      font-size: 13.5px;
      color: var(--color-silver);
      margin-top: 3px;
    }

    /* Forms */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group.full-width {
      grid-column: 1 / -1;
    }
    label {
      font-family: var(--font-condensed);
      font-size: 13px;
      font-weight: 700;
      color: var(--color-cyan);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    input[type="text"], input[type="email"], input[type="number"], select, textarea {
      padding: 10px 14px;
      border: 1px solid var(--color-border);
      border-radius: 7px;
      font-family: var(--font-body);
      font-size: 14px;
      background: var(--color-midnight);
      color: var(--color-white);
      transition: all 0.2s ease;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--color-magenta);
      background: #14171C;
      box-shadow: 0 0 10px rgba(255, 46, 136, 0.2);
    }
    textarea {
      min-height: 90px;
      resize: vertical;
    }

    /* Buttons */
    .btn {
      padding: 10px 22px;
      border-radius: 6px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      text-decoration: none;
      font-family: var(--font-body);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .btn-magenta {
      background: var(--color-magenta);
      color: #fff;
    }
    .btn-magenta:hover {
      background: #E01E74;
      box-shadow: 0 0 16px rgba(255, 46, 136, 0.4);
    }
    .btn-cyan {
      background: var(--color-cyan);
      color: #111316;
    }
    .btn-cyan:hover {
      background: #19BDCF;
      box-shadow: 0 0 16px rgba(33, 212, 232, 0.4);
    }
    .btn-danger {
      background: #E5484D;
      color: #fff;
    }
    .btn-danger:hover {
      background: #C93237;
    }
    .btn-sm {
      padding: 5px 12px;
      font-size: 12px;
    }

    /* Tables */
    .table-container {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--color-border);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13.5px;
    }
    th {
      background: var(--color-charcoal-light);
      padding: 12px 16px;
      font-weight: 700;
      color: var(--color-cyan);
      text-transform: uppercase;
      font-size: 11.5px;
      letter-spacing: 0.08em;
      font-family: var(--font-condensed);
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--color-border);
      vertical-align: middle;
      color: var(--color-white);
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    /* Badges */
    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      font-family: var(--font-condensed);
    }
    .status-pending {
      background: rgba(255, 179, 71, 0.2);
      color: var(--color-amber);
      border: 1px solid rgba(255, 179, 71, 0.4);
    }
    .status-confirmed {
      background: rgba(33, 212, 232, 0.2);
      color: var(--color-cyan);
      border: 1px solid rgba(33, 212, 232, 0.4);
    }
    .status-cancelled {
      background: rgba(229, 72, 77, 0.2);
      color: #FF666B;
      border: 1px solid rgba(229, 72, 77, 0.4);
    }

    /* Flash Messages */
    .messages-container {
      margin-bottom: 24px;
    }
    .alert {
      padding: 14px 18px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .alert-success {
      background: rgba(33, 212, 232, 0.15);
      color: #72E9F6;
      border: 1px solid rgba(33, 212, 232, 0.3);
    }
    .alert-error {
      background: rgba(255, 46, 136, 0.15);
      color: #FFA1C9;
      border: 1px solid rgba(255, 46, 136, 0.3);
    }
    .alert-info {
      background: rgba(255, 179, 71, 0.15);
      color: #FFD599;
      border: 1px solid rgba(255, 179, 71, 0.3);
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- Studio Header -->
  <header class="studio-header">
    <div class="studio-brand">
      <a href="{% url 'cms_dashboard' %}" class="studio-logo">
        <span class="neon-dot"></span>
        SEOUL STREET <span style="color: var(--color-magenta); font-family: var(--font-korean);">서울포차</span>
      </a>
      <span class="studio-badge">CMS Studio 2.0</span>
    </div>
    <div class="header-links">
      <a href="http://127.0.0.1:3000" target="_blank" class="btn-header" title="Open Public Website">
        <span>🌐</span> Public Site
      </a>
      <a href="{% url 'cms_logout' %}" class="btn-header" style="background: rgba(229, 72, 77, 0.2); border-color: rgba(229, 72, 77, 0.4);">
        <span>🚪</span> Log Out
      </a>
    </div>
  </header>

  <div class="app-layout">
    {% block layout %}{% endblock %}
  </div>

  <script>
    // Live Sidebar Search & Section Highlighting
    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('sidebarFilter');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          const query = e.target.value.toLowerCase();
          const items = document.querySelectorAll('.nav-item');
          items.forEach(item => {
            const text = item.textContent.toLowerCase();
            if (text.includes(query)) {
              item.style.display = 'block';
            } else {
              item.style.display = 'none';
            }
          });
        });
      }

      // Smooth scroll & flash highlight on click
      const navLinks = document.querySelectorAll('.nav-item a');
      navLinks.forEach(link => {
        link.addEventListener('click', (e) => {
          const targetId = link.getAttribute('href');
          if (targetId && targetId.startsWith('#')) {
            const targetEl = document.querySelector(targetId);
            if (targetEl) {
              targetEl.classList.add('flash-highlight');
              setTimeout(() => {
                targetEl.classList.remove('flash-highlight');
              }, 1600);
            }
          }
        });
      });
    });
  </script>
</body>
</html>
