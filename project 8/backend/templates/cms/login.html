{% extends "cms/base.html" %}

{% block title %}Admin Authentication | URBAN TABLE CMS{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 5rem auto; background: var(--black-card); border: 2px solid var(--brick); border-radius: 2px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); padding: 2.5rem; text-align: center;">
    <div style="font-family: var(--font-display); font-size: 2.2rem; color: var(--copper); font-weight: 700; margin-bottom: 0.2rem; letter-spacing: 0.05em;">
        URBAN TABLE
    </div>
    <div style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--steel); font-weight: 700; margin-bottom: 2rem;">
        CMS Studio Authentication
    </div>

    <form method="POST" action="{% url 'cms_login' %}">
        {% csrf_token %}
        <div style="margin-bottom: 1.25rem; text-align: left;">
            <label style="display: block; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--copper); margin-bottom: 0.4rem; font-weight: 700;">
                Administrator Username
            </label>
            <input type="text" name="username" required autocomplete="username" autofocus
                   style="width: 100%; padding: 0.75rem 1rem; background: var(--graphite); border: 1px solid rgba(255,255,255,0.15); border-radius: 2px; color: var(--offwhite); font-family: var(--font-body); font-size: 0.95rem; outline: none; transition: border 0.2s;"
                   onfocus="this.style.borderColor='var(--copper)'" onblur="this.style.borderColor='rgba(255,255,255,0.15)'"
                   placeholder="admin">
        </div>

        <div style="margin-bottom: 2rem; text-align: left;">
            <label style="display: block; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--copper); margin-bottom: 0.4rem; font-weight: 700;">
                Password
            </label>
            <input type="password" name="password" required autocomplete="current-password"
                   style="width: 100%; padding: 0.75rem 1rem; background: var(--graphite); border: 1px solid rgba(255,255,255,0.15); border-radius: 2px; color: var(--offwhite); font-family: var(--font-body); font-size: 0.95rem; outline: none; transition: border 0.2s;"
                   onfocus="this.style.borderColor='var(--copper)'" onblur="this.style.borderColor='rgba(255,255,255,0.15)'"
                   placeholder="••••••••••••">
        </div>

        <button type="submit" class="btn-copper" style="width: 100%; justify-content: center; padding: 0.85rem; font-size: 0.9rem;">
            Enter CMS Studio
        </button>
    </form>

    <div style="margin-top: 1.75rem; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 1.25rem; font-size: 0.82rem; color: var(--steel);">
        Default Credentials: <code style="color: var(--copper); background: var(--black); padding: 2px 6px; border-radius: 2px;">admin</code> / <code style="color: var(--copper); background: var(--black); padding: 2px 6px; border-radius: 2px;">adminpassword123</code>
    </div>
</div>
{% endblock %}
