{% extends "cms/base.html" %}

{% block title %}Authentication | Urban Table CMS Studio{% endblock %}

{% block auth_content %}
<div style="max-width: 440px; margin: 5rem auto; background: var(--graphite); border: 1px solid rgba(184, 115, 69, 0.4); border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); padding: 2.5rem; text-align: center;">
    <div style="font-size: 2.2rem; color: var(--amber); margin-bottom: 0.5rem;">🔥</div>
    <h2 style="font-family: var(--font-display); font-size: 1.8rem; color: var(--offwhite); font-weight: 600; margin-bottom: 0.5rem; letter-spacing: 0.05em; text-transform: uppercase;">
        Urban Table Studio
    </h2>
    <p style="color: var(--concrete); font-size: 0.9rem; margin-bottom: 2rem;">
        Staff & Pitmaster Access for 1924 Warehouse
    </p>

    <form method="POST" action="{% url 'cms_login' %}">
        {% csrf_token %}
        <div style="margin-bottom: 1.25rem; text-align: left;">
            <label style="display: block; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--amber); margin-bottom: 0.4rem; font-weight: 600;">
                Administrator Username
            </label>
            <input type="text" name="username" required autocomplete="username" autofocus
                   style="width: 100%; padding: 0.75rem 1rem; background: #161718; border: 1px solid rgba(184, 115, 69, 0.3); border-radius: 4px; color: var(--offwhite); font-family: var(--font-body); font-size: 0.95rem; outline: none; transition: border 0.2s;"
                   placeholder="e.g. admin">
        </div>

        <div style="margin-bottom: 2rem; text-align: left;">
            <label style="display: block; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--amber); margin-bottom: 0.4rem; font-weight: 600;">
                Password
            </label>
            <input type="password" name="password" required autocomplete="current-password"
                   style="width: 100%; padding: 0.75rem 1rem; background: #161718; border: 1px solid rgba(184, 115, 69, 0.3); border-radius: 4px; color: var(--offwhite); font-family: var(--font-body); font-size: 0.95rem; outline: none; transition: border 0.2s;"
                   placeholder="••••••••••••">
        </div>

        <button type="submit" class="btn-copper" style="width: 100%; justify-content: center; padding: 0.85rem; font-size: 0.95rem;">
            Sign In to CMS Studio
        </button>
    </form>

    <div style="margin-top: 1.75rem; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 1.25rem; font-size: 0.85rem; color: var(--steel);">
        Default Credentials: <code style="color: var(--amber); background: #161718; padding: 2px 6px; border-radius: 3px;">admin</code> / <code style="color: var(--amber); background: #161718; padding: 2px 6px; border-radius: 3px;">adminpassword123</code>
    </div>
</div>
{% endblock %}
