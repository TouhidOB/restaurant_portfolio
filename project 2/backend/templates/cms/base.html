<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ENSO 圓相 | Japanese Zen CMS Studio{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Noto+Sans:wght@300;400;500;600;700&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --charcoal: #202321;
            --charcoal-light: #2C302D;
            --rice-paper: #F2EFE6;
            --rice-paper-card: #FFFFFF;
            --bamboo: #B6A17B;
            --bamboo-light: #C9B896;
            --moss: #69745B;
            --vermilion: #B94B3D;
            --stone: #A6A39A;
            --border-subtle: #DEDACF;
            --text-dark: #202321;
            --text-muted: #6E726D;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans', sans-serif;
            background-color: var(--rice-paper);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, .serif-font {
            font-family: 'Cormorant Garamond', serif;
            letter-spacing: 0.04em;
        }

        .jp-font {
            font-family: 'Noto Serif JP', serif;
        }

        a {
            color: var(--bamboo);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        a:hover {
            color: var(--charcoal);
        }

        /* Zen Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            border: 1px solid transparent;
        }

        .btn-charcoal {
            background: var(--charcoal);
            color: var(--rice-paper);
            border-color: var(--charcoal);
        }

        .btn-charcoal:hover {
            background: var(--charcoal-light);
            border-color: var(--bamboo);
            color: #FFFFFF;
        }

        .btn-bamboo {
            background: var(--bamboo);
            color: #FFFFFF;
            border-color: var(--bamboo);
        }

        .btn-bamboo:hover {
            background: #9F8A65;
            color: #FFFFFF;
        }

        .btn-outline-charcoal {
            background: transparent;
            color: var(--charcoal);
            border-color: var(--charcoal);
        }

        .btn-outline-charcoal:hover {
            background: var(--charcoal);
            color: var(--rice-paper);
        }

        .btn-danger {
            background: rgba(185, 75, 61, 0.1);
            color: var(--vermilion);
            border-color: rgba(185, 75, 61, 0.4);
        }

        .btn-danger:hover {
            background: var(--vermilion);
            color: #FFFFFF;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 11px;
            letter-spacing: 0.08em;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--charcoal);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            background: #FFFFFF;
            border: 1px solid var(--border-subtle);
            color: var(--charcoal);
            font-family: 'Noto Sans', sans-serif;
            font-size: 14px;
            border-radius: 2px;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--bamboo);
            box-shadow: 0 0 0 2px rgba(182, 161, 123, 0.2);
        }

        textarea.form-control {
            min-height: 90px;
            resize: vertical;
        }

        .form-text {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* Flash Messages */
        .flash-messages {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .alert {
            padding: 14px 18px;
            border-radius: 2px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.12);
            border-left: 4px solid;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { transform: translateX(50px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .alert-success {
            background: #E8F0E6;
            color: #2D4A27;
            border-color: var(--moss);
        }

        .alert-error {
            background: #F8E9E7;
            color: #6C2219;
            border-color: var(--vermilion);
        }

        .alert-info {
            background: #EBF0F5;
            color: #243E56;
            border-color: var(--stone);
        }

        /* Red Vermilion Seal Mark */
        .vermilion-seal {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            background: var(--vermilion);
            color: #FFFFFF;
            font-size: 11px;
            font-family: 'Noto Serif JP', serif;
            border-radius: 2px;
        }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 4px 8px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border-radius: 2px;
        }

        .badge-pending {
            background: rgba(182, 161, 123, 0.2);
            color: #8C754D;
            border: 1px solid rgba(182, 161, 123, 0.5);
        }

        .badge-confirmed {
            background: rgba(105, 116, 91, 0.15);
            color: var(--moss);
            border: 1px solid rgba(105, 116, 91, 0.4);
        }

        .badge-cancelled {
            background: rgba(185, 75, 61, 0.15);
            color: var(--vermilion);
            border: 1px solid rgba(185, 75, 61, 0.4);
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% if messages %}
    <div class="flash-messages" id="flash-container">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
            <i class="fa-solid {% if message.tags == 'success' %}fa-circle-check{% elif message.tags == 'error' %}fa-circle-exclamation{% else %}fa-circle-info{% endif %}"></i>
            <div>{{ message }}</div>
        </div>
        {% endfor %}
    </div>
    <script>
        setTimeout(() => {
            const el = document.getElementById('flash-container');
            if (el) {
                el.style.transition = 'opacity 0.6s ease';
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 600);
            }
        }, 5000);
    </script>
    {% endif %}

    {% block content %}{% endblock %}

    {% block extra_js %}{% endblock %}
</body>
</html>
