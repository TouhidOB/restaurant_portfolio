{% extends 'cms/base.html' %}

{% block auth_content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, #172638 0%, #101C2C 100%); padding: 1.5rem;">
  <div style="max-width: 440px; width: 100%; background: #172638; border: 1px solid rgba(216, 195, 160, 0.3); border-radius: 4px; padding: 2.75rem 2.25rem; box-shadow: 0 25px 70px rgba(0,0,0,0.6);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 54px; height: 54px; border-radius: 4px; background: linear-gradient(135deg, #263F5A 0%, #101C2C 100%); border: 2px solid #D8C3A0; color: #D8C3A0; display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 700; margin: 0 auto 1.25rem;">
        SK
      </div>
      <h1 style="font-family: 'Cormorant Garamond', serif; font-size: 2rem; color: #F3F0E9; letter-spacing: 0.04em; margin-bottom: 0.35rem;">
        SKYLINE Level 54
      </h1>
      <p style="color: #64788A; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700;">
        Headless CMS Studio & Rooftop Control
      </p>
    </div>

    {% if messages %}
      {% for msg in messages %}
        <div style="background: rgba(244, 67, 54, 0.2); border: 1px solid #e57373; color: #ffcdd2; padding: 0.85rem; border-radius: 4px; margin-bottom: 1.5rem; font-size: 0.85rem;">
          {{ msg }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="POST" style="display: flex; flex-direction: column; gap: 1.25rem;">
      {% csrf_token %}
      <div>
        <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: #D8C3A0; margin-bottom: 0.4rem; font-weight: 700;">
          Staff Username
        </label>
        <input
          type="text"
          name="username"
          required
          placeholder="admin"
          style="width: 100%; padding: 0.85rem 1rem; background: #1D3046; border: 1px solid rgba(216, 195, 160, 0.25); border-radius: 3px; color: #F3F0E9; font-size: 0.95rem; outline: none;"
        />
      </div>

      <div>
        <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: #D8C3A0; margin-bottom: 0.4rem; font-weight: 700;">
          Password
        </label>
        <input
          type="password"
          name="password"
          required
          placeholder="••••••••••••"
          style="width: 100%; padding: 0.85rem 1rem; background: #1D3046; border: 1px solid rgba(216, 195, 160, 0.25); border-radius: 3px; color: #F3F0E9; font-size: 0.95rem; outline: none;"
        />
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; padding: 0.9rem; justify-content: center; margin-top: 0.5rem;">
        Authenticate Studio Session →
      </button>
    </form>
  </div>
</div>
{% endblock %}
