{% extends 'cms/base.html' %}

{% block content %}
<div class="cms-card">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
    <div>
      <h3 style="font-family: var(--font-display); font-size: 1.6rem; color: var(--cloud-ivory);">
        Edit Chronicle: {{ post.title }}
      </h3>
      <p style="color: var(--twilight-slate); font-size: 0.85rem;">
        Modify article content, cover image, category taxonomy, and live publication status.
      </p>
    </div>
    <a href="{% url 'cms_blog' %}" class="btn-secondary">
      ← Back to Gazette
    </a>
  </div>

  <form method="POST">
    {% csrf_token %}
    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; margin-bottom: 1.25rem;">
      <div>
        <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--champagne); margin-bottom: 0.4rem; font-weight: 700;">
          Article Headline Title *
        </label>
        <input
          type="text"
          name="title"
          value="{{ post.title }}"
          required
          style="width: 100%; padding: 0.75rem 1rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 3px; color: var(--cloud-ivory); font-size: 0.9rem; outline: none;"
        />
      </div>

      <div>
        <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--champagne); margin-bottom: 0.4rem; font-weight: 700;">
          Category *
        </label>
        <select
          name="category"
          required
          style="width: 100%; padding: 0.75rem 1rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 3px; color: var(--cloud-ivory); font-size: 0.9rem; outline: none;"
        >
          {% for cat in categories %}
            <option value="{{ cat.id }}" {% if cat.id == post.category.id %}selected{% endif %}>{{ cat.name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem; margin-bottom: 1.25rem;">
      <div>
        <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--champagne); margin-bottom: 0.4rem; font-weight: 700;">
          URL Slug
        </label>
        <input
          type="text"
          name="slug"
          value="{{ post.slug }}"
          required
          style="width: 100%; padding: 0.75rem 1rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 3px; color: var(--cloud-ivory); font-size: 0.9rem; outline: none;"
        />
      </div>

      <div>
        <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--champagne); margin-bottom: 0.4rem; font-weight: 700;">
          Author Name
        </label>
        <input
          type="text"
          name="author_name"
          value="{{ post.author_name }}"
          style="width: 100%; padding: 0.75rem 1rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 3px; color: var(--cloud-ivory); font-size: 0.9rem; outline: none;"
        />
      </div>

      <div>
        <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--champagne); margin-bottom: 0.4rem; font-weight: 700;">
          Reading Time
        </label>
        <input
          type="text"
          name="read_time"
          value="{{ post.read_time }}"
          style="width: 100%; padding: 0.75rem 1rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 3px; color: var(--cloud-ivory); font-size: 0.9rem; outline: none;"
        />
      </div>
    </div>

    <div style="margin-bottom: 1.25rem;">
      <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--champagne); margin-bottom: 0.4rem; font-weight: 700;">
        Cover Image URL
      </label>
      <input
        type="url"
        name="cover_image"
        value="{{ post.cover_image }}"
        style="width: 100%; padding: 0.75rem 1rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 3px; color: var(--cloud-ivory); font-size: 0.9rem; outline: none;"
      />
    </div>

    <div style="margin-bottom: 1.25rem;">
      <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--champagne); margin-bottom: 0.4rem; font-weight: 700;">
        Excerpt Summary *
      </label>
      <textarea
        name="excerpt"
        rows="2"
        required
        style="width: 100%; padding: 0.75rem 1rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 3px; color: var(--cloud-ivory); font-size: 0.9rem; outline: none; resize: vertical;"
      >{{ post.excerpt }}</textarea>
    </div>

    <div style="margin-bottom: 1.5rem;">
      <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--champagne); margin-bottom: 0.4rem; font-weight: 700;">
        Full Article Content *
      </label>
      <textarea
        name="content"
        rows="12"
        required
        style="width: 100%; padding: 0.75rem 1rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 3px; color: var(--cloud-ivory); font-size: 0.9rem; outline: none; resize: vertical;"
      >{{ post.content }}</textarea>
    </div>

    <div style="display: flex; align-items: center; gap: 0.6rem; margin-bottom: 2rem;">
      <input
        type="checkbox"
        id="isPublishedPost"
        name="is_published"
        {% if post.is_published %}checked{% endif %}
        style="width: 16px; height: 16px; accent-color: var(--champagne);"
      />
      <label for="isPublishedPost" style="font-size: 0.88rem; font-weight: 700; color: var(--cloud-ivory);">
        Published & Visible in Gazette (/blog/{{ post.slug }})
      </label>
    </div>

    <button type="submit" class="btn-primary" style="padding: 0.85rem 2rem;">
      Save Chronicle Changes ➔
    </button>
  </form>
</div>
{% endblock %}
