{% extends 'cms/base.html' %}

{% block content %}
<div class="cms-card">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
    <div>
      <h3 style="font-family: var(--font-display); font-size: 1.5rem; color: var(--cloud-ivory);">
        Master JSON Schema Architect
      </h3>
      <p style="color: var(--twilight-slate); font-size: 0.85rem;">
        Direct low-level editing and validation of the entire SiteConfig content payload.
      </p>
    </div>
    <span style="font-size: 0.82rem; color: #81c784; font-family: var(--font-mono); font-weight: 700;">
      ● Database Synced
    </span>
  </div>

  <form method="POST">
    {% csrf_token %}
    <div style="margin-bottom: 1.5rem;">
      <textarea
        name="schema_json"
        rows="26"
        style="width: 100%; padding: 1.25rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 3px; color: var(--cloud-ivory); font-family: var(--font-mono); font-size: 0.85rem; line-height: 1.6; outline: none;"
      >{{ schema_json }}</textarea>
    </div>

    <button type="submit" class="btn-primary" style="padding: 0.85rem 2rem;">
      Validate & Commit Master Schema
    </button>
  </form>
</div>
{% endblock %}
